<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="Echo Blade">
		<meta name="theme-color" content="#12121a">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #12121a; }
body { touch-action: none; color: #cfe8ff; font-family: system-ui, sans-serif; }
#canvas { display: block; }
#status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #12121a; }
#status h1 { margin: 0; font-size: 28px; letter-spacing: 6px; font-weight: 300; }
#bar { width: min(60vw, 320px); height: 4px; background: #23233a; border-radius: 2px; overflow: hidden; }
#fill { width: 0; height: 100%; background: #4fd8ff; transition: width .15s linear; }
#msg { font-size: 14px; opacity: .8; text-align: center; padding: 0 24px; }
#status.error #fill { background: #ff5a5a; }
		</style>
		$GODOT_HEAD_INCLUDE
		<!-- O deploy troca o marcador abaixo por window.ECHOS_BUILD = {...} (web/inject_build.sh). Inline: sem cache antigo. -->
		<script>/*ECHOS_BUILD*/</script>
	</head>
	<body>
		<canvas id="canvas">O seu navegador não suporta canvas.</canvas>
		<div id="status">
			<h1>ECHO BLADE</h1>
			<div id="bar"><div id="fill"></div></div>
			<div id="msg">Carregando…</div>
		</div>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const statusEl = document.getElementById('status');
const fill = document.getElementById('fill');
const msg = document.getElementById('msg');

function fail(text) {
	statusEl.classList.add('error');
	msg.textContent = text;
}

const missing = Engine.getMissingFeatures({ threads: false });
if (missing.length > 0) {
	fail('Seu navegador não suporta: ' + missing.join(', '));
} else {
	engine.startGame({
		onProgress: function (current, total) {
			if (total > 0) { fill.style.width = Math.round(current / total * 100) + '%'; }
		},
	}).then(function () {
		statusEl.style.display = 'none';
	}).catch(function (err) {
		fail('Falha ao iniciar: ' + err.message);
	});
}
		</script>
	</body>
</html>
